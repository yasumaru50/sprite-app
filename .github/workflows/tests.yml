name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ブラウザ版（Pyodide は 32 ビット）向けの確かめ。tests/int32_numpy.py の仕組みは Linux の NumPy で動かす
  int32-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run 32-bit (Pyodide) checks
        run: python -m pytest -q tests/test_sprite_int32.py tests/test_sprite_convert.py tests/test_sprite_web_motion.py tests/test_sprite_web_table.py tests/test_sprite_nod.py tests/test_sprite_stretch.py tests/test_sprite_region.py tests/test_sprite_web_region.py tests/test_sprite_skipped.py tests/test_sprite_gif.py tests/test_sprite_frames.py tests/test_sprite_steady.py tests/test_sprite_same.py tests/test_sprite_simplify.py tests/test_sprite_edit.py tests/test_sprite_touchup.py tests/test_sprite_swap.py tests/test_sprite_talk.py tests/test_sprite_fx.py tests/test_sprite_join.py tests/test_sprite_jump_spin.py tests/test_sprite_anims.py tests/test_sprite_bundle.py tests/test_sprite_canvas.py tests/test_sprite_web_onion.py tests/test_sprite_compare.py tests/test_still.py tests/test_still_cli.py tests/test_still_pattern.py tests/test_still_modern.py tests/test_still_photo.py

  # すべてのテスト（Linux）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
